        could mean the sampled sub-area, or the stratum size, or a minimum
        field-selection quantum. It is NOT a sample count and must not be read
        as one. Recorded because it is the only density-like figure in any
        public document for this project.
    n_samples: {value: null, status: withheld, source: agreena_val_v4, locator: "PD Appendix 6 (soil sampling protocol) and Appendix 9 (stratification), cited by the validation report and not reproduced in it"}
    cores_per_composite:
      value: null
      status: withheld
      source: agreena_val_v4
      locator: >-
        the parameter table lists 'N | Unitless | Number of cores' with the
        value given as 'to be calculated'; the realised value is in PD Appendix 6
      note: >-
        The parameter is named in the monitored-parameter table, so its
