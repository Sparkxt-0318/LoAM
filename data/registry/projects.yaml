projects:

  # =========================================================================
  - project_id: CAR1459
    project_name: Indigo U.S. Project No. 1
    registry: Climate Action Reserve
    protocol: Soil Enrichment Protocol (SEP) v1.1
    developer: Indigo Ag
    in_loam_scope: true
    scope_note: >-
      US cropland, temperate, tillage/residue/fertiliser/cover-crop practices,
      0-30 cm. The closest match in the corpus to LoAM's scope lock.
    disclosure_tier: 1
    disclosure_note: >-
      The most completely documented soil carbon project found. A 102-page
      monitoring plan naming the sample design, the estimator, the sampling
      density, the assignment rule for each sample type, and the uncertainty
      equation. Everything below comes from that one document.

    geography:
      value: "16 US states: AR, IL, IN, IA, KS, KY, LA, MN, MS, MO, NE, ND, OH, OK, SD, TN"
      status: stated
      source: car1459_mp_rp1
      locator: "Section 3, project location; 'mainly located in the Midwest and Southeast agricultural regions'"
    area:
      value: 100371
      units: acres
      status: stated
      source: car1459_mp_rp1
      locator: "Section 1.2 / 3; figure as of the v3.1 document date, an aggregated project that grows"
      note: "40,619 ha. 175 enrolled growers, 573 acres/grower average."
    n_growers:
      value: 175
      status: stated
      source: car1459_mp_rp1
      locator: "Section 3"
    practices:
      value: "tillage and/or residue management, fertiliser management, cover cropping"
      status: stated
      source: car1459_mp_rp1
      locator: "Table 3.1, project activities and mechanisms"

    quantification_approach:
      value: measure_and_model
      status: stated
      source: car1459_mp_rp1
      locator: "Section 1.2 — 'running a biogeochemical model at a random sample of points at which we collect soil samples'"
    model:
      value: DayCent-CR
      status: stated
      source: car1459_mp_rp1
      locator: "Section 5; model validation report IndigoCarbon US-1 2020 0046"

    sampling_design:
      value: >-
        Two designs used in different strata. Design 1: POISSWR (Poisson
        sampling with replacement) from a national point map. Design 2 (from
        2020-09-13): two-stage PPSWR over fields by area, then SRSWR within
        field, self-weighting with m constant across fields.
      status: stated
      source: car1459_mp_rp1
      locator: "Sections 5.2.2.1 and 5.2.2.2; Design 2 is the example in SEP v1.1 Appendix D.4"
    sampling_density:
      value: 8
      units: acres_per_sample_point
      status: stated
      source: car1459_mp_rp1
      locator: "Table 5.2 — 'Sample Design 1 (POISSWR), 1 point per 8 acres on average'"
      note: >-
        3.24 ha per point. Applies to Designs 1 only; the Design 2 density is a
        function of the two-stage allocation and is not given as a single figure.
    n_samples:
      value: null
      status: not_disclosed
      source: car1459_mp_rp1
      locator: "searched sections 5.2 and 6.4; the plan gives the RULE (1 point per 8 acres) but no realised count"
      note: >-
        INFERRABLE but not stated: at 1 point per 8 acres over 100,371 acres,
        Design 1 implies of order 12,500 carbon sampling points. Left as
        not_disclosed rather than recorded as a number, because the two designs
        were applied in different strata and the split is not given.
    cores_per_composite:
      value: 1
      status: stated
      source: car1459_mp_rp1
      locator: "Section 6.4.1.2 — 'At each carbon sampling location, an individual 30-cm sample was collected'"
      note: >-
        THE MOST INTERESTING NUMBER IN THE CORPUS FOR LoAM. Carbon samples are
        NOT composited: one core per assay, per point. Compositing is used only
        for pH and texture. This is the single-core-per-plot design G3/D-053
        analysed, at continental scale, and it is the opposite of Potash et
        al.'s assumed 4-core composite.
    depth_cm:
      value: [0, 30]
      status: stated
      source: car1459_mp_rp1
      locator: "Sections 6.4.1.2-6.4.1.4; bulk density taken over 30.48 cm (12 inches)"
      note: "Carbon 30 cm, bulk density 30.48 cm — a 1.6% depth mismatch between the two terms of the stock."
    depth_increments:
      value: null
      status: not_disclosed
      source: car1459_mp_rp1
      locator: "full-text search of the 102-page plan for 'depth increment', 'equivalent soil mass', 'soil mass', '0-10', '10-30' — no match"
    depth_convention:
      value: null
      status: not_disclosed
      source: car1459_mp_rp1
      locator: "same search; neither 'fixed depth' nor 'equivalent soil mass' appears anywhere in the document"
      note: >-
        Single 30-cm sample with no increments cannot support an ESM correction,
        so the accounting is fixed-depth by construction. That is an INFERENCE
        from the absence of increments and is recorded as not_disclosed rather
        than as a stated fixed_depth, because the document never says so.
    bulk_density:
      value: "measured at 1 of every 5 carbon points before 2020-03-16, 1 of every 3 after; interpolated elsewhere"
      status: stated
      source: car1459_mp_rp1
      locator: "Section 5.2.3.2 and Table 5.2; slide-hammer or demolition-hammer core with liner, 30.48 cm"
      note: >-
        The frequency was raised from 1-in-5 to 1-in-3 explicitly 'to increase
        the precision of our estimates of SOC stock changes' after dropping a
        planned prediction device. A documented design change made for variance
        reasons — rare, and directly useful to Phase 5.
    lab_method:
      value: dry combustion
      status: stated
      source: car1459_mp_rp1
      locator: "Section 6.4.2; NAPTP-PAP accredited laboratory per SEP v1.1 Table 6.3"
    remeasurement_interval_years:
      value: 5
      status: stated
      source: car1459_mp_rp1
      locator: "Section 5 — 'Indigo Ag plans to re-sample soils at least every 5 years using direct measurements'"
      note: "'At least every 5 years' is an upper bound on the interval, not a schedule."
    stratification:
      value: "the two sample designs were implemented independently in different strata"
      status: stated
      source: car1459_mp_rp1
      locator: "Section 5.4.6"
    n_strata:
      value: null
      status: not_disclosed
      source: car1459_mp_rp1
      locator: "Section 5.4.6 refers to 'all strata' without giving a count or a stratification variable"

    uncertainty_treatment:
      value: "UNC_t = z(70%) x s(ER_t) / ER_t, where s(ER_t) is the half-width of the 95% confidence interval"
      status: stated
      source: car1459_mp_rp1
      locator: "Tables 5.11 and 5.12, citing SEP v1.1 Equation 5.1"
      note: >-
        z(70%) = 0.5244, and s(ER_t) is the 95% CI HALF-WIDTH (= 1.96 SE), so
        the deduction is 0.5244 x 1.96 = **1.028 relative standard errors**,
        crediting at the 15.2nd percentile. Three error sources are named as
        entering it: sample error, measurement error of model inputs, and model
        prediction error from calibration and validation residuals.
        CROSS-PROTOCOL (D-057, both verified from primary): VM0042 v2.2 deducts
        0.4307 relative SE (33.3rd percentile) and the Australian rule 0.253
        (40th percentile). CAR SEP is therefore **2.38x more conservative than
        VM0042 and 4.06x more conservative than the ACCU rule on identical
        measured variance.** Same construct, very different severity - the corpus
        must not treat them as interchangeable.
    uncertainty_deduction_applied_pct:
      value: null
      status: not_disclosed
      source: car1459_mp_rp1
      locator: "the plan gives the equation; the realised value is in the reporting-period monitoring reports, not held"
    credits_issued:
      value: null
      status: not_disclosed
      source: car1459_docs
      locator: >-
        the 64-document public list carries monitoring reports RP1-RP5 and
        verification reports; the issuance total was not extracted in this pass
      note: "Retrievable — CAR1459_Monitoring_Report_v5.8.pdf is public. Not fetched this session."
    claimed_soc_change_rate:
      value: null
      status: not_disclosed
      source: car1459_mp_rp1
      locator: "the monitoring plan states the method, not the realised result"

