      note: "INFERRED from the methodology requirement plus the stated QA1 choice. The project's own schedule is not disclosed."
    uncertainty_deduction_applied_pct:
      value: 31.35
      status: stated
      source: agreena_val_v4
      locator: >-
        corrective action log CAR ID 60 — 'The uncertainty value is 31.35% and
        is consistently reported in PD Table 4-17'
      note: >-
        The VVB raised CAR#60 because the PD reported 23.97% in Table 4-17 and
        14.53% in Section 4.4.4; 31.35% is the resolved value. Worth keeping:
        a nearly one-third figure, and an internal inconsistency the validator
        had to catch. CORRECTED 2026-08-13 (D-060): an earlier note here claimed
        0.4307 is 'a v2.2 figure absent from v2.0'. That is FALSE. VM0042 v2.0
        Sec 8.6.4 Equation (65) uses t_alpha=0.666 ~= 0.4307, identically to
        v2.2 Equation (74). This IS a 0.43-SE deduction. See
        docs/vm0042_s2_verification.md. SCOPE ATTEMPTED AND NOT CONFIRMED
        2026-08-13 (D-061): the PD is not public outside the SPA registry, and
        the validation report calls this 'the final uncertainty deduction'
        (CAR ID 60), singular and project-level, reported in Table 4-17 and
        Section 4.4.4 without disaggregation by pool. VM0042 Sec 8.6.4 requires
        deductions 'estimated and applied separately for each ERR source', so a
        single figure is either the SOC/QA1 deduction or a pooled one.
        CONSEQUENCE: `claimed_change_in_mdd_units` stays CONDITIONAL on this
        because MDD is defined on SOC stocks; `implied_90ci_halfwidth_pct` does
        NOT, because both sides refer to the same ERR estimate.
        SEE ALSO `effective_deduction_on_gross_pct`: 31.35% is an uncertainty
        STATISTIC, not the fraction of credits withheld.
    implied_90ci_halfwidth_pct:
      value: 119.7
      status: inferred
      source: vcs_mr_v44
      locator: "derived from the stated 31.35% via VCS Methodology Requirements Sec 2.4: (31.35 / 0.4307) x 1.6449"
      note: >-
        DERIVED BY US, and the most robust quantity in this record because it
        does not depend on the pool scope of 31.35%. MR Sec 2.4 defines the
        deduction as (Uncertainty / t_alpha=10%) x t_alpha=66.6% with
        t = 1.6449 and 0.4307, where Uncertainty is the half-width of the 90%
        CI as a percentage of the mean. Inverting: the implied half-width is
        119.7% of the ERR estimate. MR Sec 2.4's final bullet states VERBATIM:
        'Where the half-width of the two-sided 90 percent confidence interval
        exceeds 100 percent of the reduction and removal estimate, the project
        is not eligible for crediting.' This project sits 19.7 points above
        that bar. INTERPRETATION NOT ASSERTED: VM0042 v2.0 Sec 8.6.4 points to
        'the latest version of' MR Sec 2.4 but does not reproduce the bar, and
        the bar is a v4.4-era provision (Oct 2023) postdating VM0042 v2.0's
        approval (May 2023) and predating this project's validation (Dec 2024).
        Either the bar binds through that pointer, or VM0042 does not implement
        a program requirement it cross-references. Both are findings; resolving
        which holds needs Verra's own reading, which we do not have.
    uncertainty_rule_in_force:
      value: "VM0042 v2.0 Sec 8.6.4 Equation (65): UNC = (sqrt(s2)/mean * 100) * t_alpha=0.666, t ~= 0.4307"
      status: stated
      source: vm0042_v20
      locator: "VM0042 v2.0 Sec 8.6.4, printed pp. 74-76, Equation (65)"
      note: >-
        CORRECTED 2026-08-13 (D-060), and the status changed from `inferred` to
        `stated` because it is now read directly off the methodology rather than
        inferred. The previous value here — 'Pathway A (Equation 83), case N3,
        threshold A = 0%' — DESCRIBED A RULE THAT DOES NOT EXIST. Verbatim
        searches of VM0042 v2.0, v2.1, v2.2, the v2.2 greenlined text, the
        Corrections and Clarifications to v2.0, and the v3.0 consultation draft
        return ZERO hits for 'Pathway A', 'Case N1' and 'Case N3', and no
        Equation 83 or 84. All versions carry t ~= 0.4307. There are no cases,
        no pathways, no threshold A, and no cap. The IPCC 2019 Tier 1 defaults
        for EF_Ndirect recorded in CAR ID 01 item V remain a true fact about the
        project but select nothing. See docs/vm0042_s2_verification.md.
    implied_relative_se_pct:
      value: 72.79
      status: inferred
      source: vm0042_v20
      locator: "derived from the stated 31.35% by inverting VM0042 v2.0 Equation (65): 31.35 / 0.4307"
      note: >-
        DERIVED BY US. CORRECTED 2026-08-13 (D-060) from 16.0, which was
        computed by dividing by t_0.975 = 1.960 under the nonexistent Equation
        83. The rule actually in force divides by t_alpha=0.666 ~= 0.4307,
        giving 72.79% at large df. Note this is a LOWER BOUND in df: 0.4307 is
        the large-sample limit and the t-value rises as df falls, so smaller
        samples imply a smaller SE. Depends entirely on 31.35% being the
        Equation 65 deduction for SOC, which has NOT been re-verified in this
        container. See docs/vm0042_s2_verification.md Sec 7.
    claimed_change_in_mdd_units:
      value: 0.70
      status: inferred
      source: vm0042_v20
      locator: "derived from the stated 31.35% via VM0042 Equation (65) and Equation (2)"
      note: >-
        DERIVED BY US. CORRECTED 2026-08-13 (D-060) from 3.19, which INVERTED
        THE DIRECTION OF THE FINDING. The general identity holds —
        delta/MDD = k / ((t_alpha + t_beta) * UNC) — but k for VM0042 is 0.4307,
        not 1.960. With MDD from Sec 8.2.1.3 Equation (2),
        MDD >= (S/sqrt(n))(t_alpha + t_beta) (NOT 'Sec 9.3.1 Eq 88', which does
        not exist), the claimed SOC change is 0.70x the project's own minimum
        detectable difference at 50% power and 0.49x at 80% power. That is, the
        claimed change is SMALLER than what the design can detect. This is a
        stronger finding than the one it replaces, and it is correspondingly
        more important that 31.35% be re-verified before it is used externally.
        See docs/vm0042_s2_verification.md Sec 7.
    effective_deduction_on_gross_pct:
      value: 18.48
      status: inferred
      source: agreena_val_v4
      locator: >-
        ex-ante summary table — baseline 12,676,641.20; project -742,116.10;
        leakage 87,250.58; uncertainty deduction 2,464,107.81; net 10,867,398.91
      note: >-
        DERIVED BY US, and it is NOT the same number as the 31.35% headline.
        Gross ERRs are 13,331,506.72 tCO2e and the table's own deduction is
        2,464,107.81, i.e. 18.48% of gross (the table is internally exact:
        13,331,506.72 - 2,464,107.81 = 10,867,398.91). The two reconcile through
        Equations 36/37, which apply the deduction as (1 - UNC * share) with each
        stream scaled by its fraction of gross ERRs; 18.483/31.35 = 0.5896 is
        consistent with a reductions:removals split of about 71:29. That split is
        NOT verifiable from public documents, so this is a consistency check that
        passes, not independent confirmation. CONSEQUENCE: any cross-registry
        comparison of deduction severity that takes a PD headline percentage at
        face value overstates this project's haircut by about 70%.
    uncertainty_components_pooled:
      value: "RothC model prediction variance + soil sampling variance"
      status: stated
      source: agreena_val_v4
      locator: >-
        CAR ID 21.4 project participant response — 'To calculate the uncertainty
        deductions we make use of both the model prediction variance, which is
