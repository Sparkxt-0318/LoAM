# ---------------------------------------------------------------------------
# Protocol-level requirements, read from the methodologies themselves.
#
# Kept SEPARATE from `projects` on purpose. A methodology requirement is what a
# project OUGHT to do; a project field is what it DID. Merging them would let a
# requirement masquerade as a disclosure, which is the single easiest way to
# overstate this corpus. Nothing here may be copied into a project record.
#
# Added 2026-08-12 (D-057) after VM0042 was retrieved and read.
# ---------------------------------------------------------------------------

protocol_requirements:

  - protocol: Verra VM0042 Improved Agricultural Land Management
    version_read: "v2.2 (greenlined, October 2025), 183 pp."
    also_held: >-
      v2.0, v2.1 and the v3.0 draft. CORRECTED 2026-08-13 (D-060): v2.0's rule
      is NOT structurally different, as D-059 claimed. Every version from v2.0
      through the v3.0 draft uses the same construction and the same 0.4307.
      The separate v2.0 entry below is retained for its locators, not because
      the rule differs.
    source: vm0042_v22
    uncertainty_deduction:
      rule: "UNC = (sqrt(s^2)/mean x 100) x t_0.667"
      locator: "Section 8.6.4, Equation 74"
      k_value: 0.4307
      k_definition: >-
        VERBATIM: "t-value for a one-sided student's t-distribution at 0.667
        (66.7%) confidence interval with degrees of freedom appropriate to the
        sampling design used. Equal to approximately 0.4307 at large sample
        sizes (dimensionless)". Figure 4: the deduction is based on the 33.3rd
        percentile of the estimated probability distribution.
      status: stated
      caveats: >-
        (a) It is a t-value, NOT a constant: 0.4307 is the large-sample limit, so
        a project with few samples takes a LARGER percentage deduction for the
        same relative standard error. The haircut is a function of the design.
        (b) CORRECTED 2026-08-13 (D-060). This previously read "Verified in v2.2
        only, and ABSENT from v2.0". That is FALSE: 0.4307 appears verbatim in
        approved v2.0 (Equation 65), v2.1, v2.2 and the v3.0 draft. There is no
        version dependence to carry.
    minimum_detectable_difference:
      locator: "Section 8.2.1, item 11, Equations (1) and (2), citing FAO (2019)"
      equation_1: "MDD >= (S / sqrt(n)) x (t_alpha,v + t_beta,v)"
      equation_2: "n >= ( S x (t_alpha + t_beta) / MDD )^2"
      parameters: >-
        S = standard deviation of the DIFFERENCE in SOC stocks between t0 and t1;
        t_alpha two-sided at a significance level "frequently taken as 0.05";
        t_beta one-sided for type II error "(e.g., 90%)".
      optionality: >-
        VERBATIM: "A power analysis MAY be conducted to calculate the number of
        samples needed to enable accounting of a minimum detectable difference,
        following Equations (1) and (2) (FAO, 2019). HOWEVER, PROJECTS ARE NOT
        REQUIRED TO TAKE THIS NUMBER OF SAMPLES."
      status: stated
      significance_for_loam: >-
        Equation (2) IS the Phase 5 inverted audit. The method is the
        methodology's own calculation, made optional in the same sentence. The
        only input we supply is S, which VM0042 expects from the project's own
        pre-sampling ("5 to 10 soil samples per stratum") and which no project
        publishes. See D-057 and docs/phase5_inverted_audit_design.md.
    depth_requirements:
      minimum_depth_cm: 30
      esm_required: true
      locator: "Section 8.2.1, items (b)-(e)"
      detail: >-
        VERBATIM: "To enable the ESM approach, soil samples at re-sampling must be
        divided into at least two increments." Soils "must be sampled deeper than
        the minimum 30 cm required for reporting SOC stock changes" where
        extrapolation would otherwise be needed, and "Where possible, soils should
        be sampled to 50 cm depth". Accepted ESM tools: the Wendt and Hauser
        (2013) spreadsheet, and the von Haden et al. (2020) R script - which is
        also LoAM's own corroborating source for component 6.
      status: stated
    remeasurement:
      interval_years: 5
      locator: "Sections 8.3 and 9; 'SOC stocks must be directly remeasured every five years'"
      status: stated
    sampling_design:
      required_strategy: stratified random sampling
      min_control_sites_project: 3
      min_control_sites_per_stratum: 1
      locator: "Sections 8.2.1 and the Quantification Approach 2 requirements"
      detail: >-
        "at least three control sites are required across the entire project
        area, but more will decrease uncertainty, particularly where the total
        number of control sites is less than ten"; "there must be at least one
        control site per stratum". Pre-sampling of 5 to 10 samples per stratum
        may estimate SOC variance where soil data are unavailable.
      status: stated
    quantification_approaches:
      QA1: measure and model
      QA2: >-
        measure and remeasure, SOC ONLY - "relevant where models are unavailable
        or have not yet been validated or parameterized, or where project
        proponents prefer to use a direct measurement approach"
      QA3: default factors
      status: stated
      locator: "Section 8.1"
    laboratory:
      preferred_method: dry combustion (Dumas)
      also_permitted: "NIR, Vis-NIR, MIR, LIBS, INS - under Appendix 4 criteria"
      accreditation: "ISO/IEC 17025 where possible; same laboratory for the entire project lifetime"
      analytical_error_definition: >-
        VERBATIM: the laboratory "should quantify and report analytical error
        statistics (determined by REPEATED ANALYSES OF THE SAME SAMPLE)". That is
        Poeplau's NARROW analytical error - technical replicates of one milled
        sample - not the subsampling-inclusive figure. Direct input to D-054,
        which remains OPEN.
      locator: "Section 8.2.1.4"
      status: stated

  # -------------------------------------------------------------------------
  # VM0042 v2.0 — REWRITTEN 2026-08-13 (D-060) from the APPROVED v2.0.
  # The previous entry described the December 2021 public-comment draft's
  # two-pathway/two-case Section 8.6.4 and asserted it was v2.0's rule. It is
  # not: Verra replaced that construction before approving v2.0 in May 2023.
  # The approved rule is one formula with the SAME 0.4307 constant as v2.2, so
  # the version dimension collapses. See docs/vm0042_s2_verification.md.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # VCS PROGRAM-LEVEL rule, added 2026-08-13 (D-061). This is the document
  # VM0042 Sec 8.6.4 defers to, and it governs every VCS methodology that
  # implements it — so the inversion is NOT VM0042-specific.
  # -------------------------------------------------------------------------
  - protocol: VCS Program (Verra) — Methodology Requirements
    version_read: "v4.4, updated 4 October 2023, 88 pp."
    source: vcs_mr_v44
    uncertainty_deduction:
      rule: >-
        Discount factor = (Uncertainty / t_alpha=10%) x t_alpha=66.6%, where
        Uncertainty is the half-width of the 90% CI as a percentage of the mean
        estimate. Reduces to 0.4307 x sigma_rel, identical to VM0042 Eq 65/74.
      locator: "Section 2.4 Uncertainty, printed p. 12"
      k_value: 0.4307
      k_quote: >-
        VERBATIM: t_alpha=10% = 't-value for the two-sided 90% confidence
        interval, approximately 1.6449'; t_alpha=66.6% = 't-value for a
        one-sided 66.67% confidence interval, approximately 0.4307'. Verra's
        own worked example: 32.9% / 1.6449 * 0.4307 = 8.6%.
      no_cap: >-
        There is NO cap on the deduction at program level, as there is none at
        methodology level. The MIN{100%, ...} recorded under D-059 exists only
        in the superseded Dec-2021 draft. The planned cap sweep is DELETED.
      eligibility_bar: >-
        VERBATIM, final bullet of Sec 2.4: 'Where the half-width of the
        two-sided 90 percent confidence interval exceeds 100 percent of the
        reduction and removal estimate, the project is not eligible for
        crediting.' Not a cap on the deduction — a bar on the project.
        Translated: 1.6449 x SE > delta, i.e. sigma_rel > 60.79%, i.e.
        UNC > 26.18%. THIS IS THE SWEEP'S THRESHOLD, and it is Verra's, not
        ours. At that bar delta/MDD = 0.839, so the VCS program explicitly
        permits crediting claims down to 84% of their own 50%-power minimum
        detectable difference.
      materiality_floor: >-
        Sec 2.4 also sets a floor: where the 90% CI half-width is unlikely to
        exceed 10% of the estimate, methodologies MAY EXCLUDE random
        uncertainty entirely. Relevant to the sweep's population — a
        methodology below the floor publishes no deduction to invert.
      status: stated

  - protocol: Verra VM0042 Improved Agricultural Land Management
    version_read: "v2.0 APPROVED (May 2023), 157 pp."
    source: vm0042_v20
    uncertainty_deduction:
      rule: >-
        ONE FORMULA, identical in construction to v2.2 Equation 74.
        Equation (65): UNC_dot,t = Uncertainty x t_alpha=0.666, where
        Uncertainty = (sqrt(s2_dot,t) / mean_dot,t) x 100.
      locator: "Section 8.6.4, printed pages 74-76; Equation (65)"
      k_value: 0.4307
      k_quote: >-
        VERBATIM: "Critical value of a one-sided student's t-distribution at
        significance level alpha = 0.666 (66.6%) with degrees of freedom
        appropriate to the sampling design used. Equal to approximately 0.4307
        at large sample sizes (dimensionless)".
      no_cases_no_pathways: >-
        There are NO cases, NO pathways, NO threshold A, and NO cap. Verbatim
        searches for 'Pathway A', 'Case N1' and 'Case N3' return zero hits in
        approved v2.0, v2.1, v2.2, the v2.2 greenlined text, the Corrections
        and Clarifications to v2.0, and the v3.0 consultation draft. They
        appear ONLY in the December 2021 public-comment draft (vm0042_v20_draft).
      s2_identical_to_v22: >-
        VERIFIED at three levels. (a) Same definition and units. (b) Same
        Section 8.6 subsection tree, heading for heading, the only difference
        being 8.6.1.3 retitled 'Cumulative Crediting' -> 'Cumulative Modeling'.
        (c) Same equations: v2.0 Eq (54) s2 = s2_sampling/A^2 + s2_model and
        Eq (55) s2_model = sum (A_h^2/A^2) s2_model,h are identical symbol for
        symbol to v2.2 Eq (63) and Eq (64), including the Cochran 1977 Eq 13.39
        and Som 1995 Eq 25.10 citations. Equation maps differ by a uniform +9.
      mdd_equation: >-
        Section 8.2.1.3, printed p. 29, Equation (2): MDD >= (S/sqrt(n)) x
        (t_alpha,nu + t_beta,nu); Equation (3) inverts it for n. There is no
        'Section 9.3.1' and no 'Equation 88'. Section 9.2's monitored-parameter
        table lists MDD against 'Equations (2), (3)'.
      sample_size_optional: >-
        VERBATIM, Section 8.2.1.3 item 10: "A power analysis may be conducted to
        calculate the number of samples needed to enable accounting of a minimum
        detectable difference, following Equations (2) and (3) (FAO, 2019).
        However, projects are not required to take this number of samples."
      status: stated
    minimum_detectable_difference:
      locator: "Section 9.3.1, Equations 88 and 89, citing FAO (2019)"
      equation_88: "MDD >= (S / sqrt(n)) x (t_alpha,v + t_beta,v)"
      optionality: >-
        VERBATIM, from the monitored-parameter tables for MDD, S, n, n-1 and t:
        "Calculation of the number of required samples to detect a minimum
        difference is OPTIONAL for projects."
      status: stated
      significance_for_loam: >-
        THE IDENTITY, RESTATED 2026-08-13 (D-060). The previous text derived
        UNC = MDD/delta from "Equation 83 under case N3" and "Equation 88",
        neither of which exists in approved VM0042. The identity survives in
        general form and still needs no undisclosed parameter, but it is NOT an
        equality — it carries the constant k:
        delta/MDD = k / ((t_alpha + t_beta) * UNC), with k = 0.4307 for every
        version of VM0042 and MDD from Section 8.2.1.3 Equation (2). A project's
        published deduction still fixes its detectability ratio exactly, and the
        MDD calculation that would have exposed it is still optional. The
        screening line is UNC > 21.97% at 50% power, UNC > 15.37% at 80%: above
        it, the project claims a change smaller than it can detect. See
        docs/vm0042_s2_verification.md Sec 6.
    n2o_quantification_approach_test:
      locator: "Section 8.2.8"
      superseded_note: >-
        RETAINED AS FACT, VOIDED AS A TEST (D-060). Section 8.2.8 and the QA1 /
        QA3 split are real and correctly transcribed. But they select nothing:
        approved VM0042 has no cases, so there is no "case" for this test to
        determine. The final sentence below is withdrawn.
      detail: >-
        The mechanical test for which CASE applies. Direct and indirect N2O from
        nitrogen inputs are "quantified in the baseline scenario under
        Quantification Approach 1 or Quantification Approach 3. If quantified
        under Quantification Approach 1, Equation 10 is used. If quantified under
        Quantification Approach 3, Equation 11 is used." QA1 models the flux;
        QA3 sums default-factor terms (Equation 12). A project using IPCC Tier 1
        default emission factors for EF_Ndirect is therefore case N3.
      status: stated
    uncertainty_application:
      locator: "Equations 36 and 37"
      detail: >-
        The deduction does NOT enter as a flat (1 - UNC) on gross ERRs. Each of
        the reduction and removal streams is scaled by its own share of gross
        ERRs: ER_net = (...) x (1 - UNC x share). CONSEQUENCE: a published UNC
        percentage is an uncertainty STATISTIC, not the fraction of credits
        withheld, and the two differ by the share factor — which no registry in
        this corpus publishes. Cross-registry severity comparisons must carry
        this caveat.
      status: stated

  - protocol: Climate Action Reserve Soil Enrichment Protocol
    version_read: "v1.1 - read indirectly, through CAR1459's monitoring plan"
    source: car1459_mp_rp1
    uncertainty_deduction:
      rule: "UNC_t = z(70%) x s(ER_t) / ER_t, where s(ER_t) is the 95% CI HALF-WIDTH"
      locator: "CAR1459 monitoring plan Tables 5.11 and 5.12, citing SEP v1.1 Equation 5.1"
      k_value_relative_se: 1.028
      status: inferred
      note: >-
        INFERRED effective k: z(70%) = 0.5244 multiplies the 95% CI half-width,
        which is 1.96 SE, giving 1.028 relative standard errors and crediting at
        the 15.2nd percentile. The DERIVATION is ours; the rule and the
        half-width definition are stated in the project document. The SEP itself
        has not been read directly - that is the remaining gap here.

# Cross-protocol severity, all three on identical measured variance (D-057):
#   ACCU (60% exceedance, per VM0042's own footnote)  k = 0.253  -> 40th pct
#   Verra VM0042 v2.2                                k = 0.431  -> 33.3rd pct
#   CAR SEP v1.1                                     k = 1.028  -> 15.2nd pct
# CAR SEP is 2.38x VM0042 and 4.06x the ACCU rule. The same soil, design and
# variance yield a fourfold different haircut depending only on the registry.

