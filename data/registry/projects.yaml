      model_start_dates: "0/999 (0%)"
      supplementary_project_information: "0/999 (0%)"
    sampling_design_fields_published: none
    note: >-
      The register carries no field for sample count, sampling depth, cores per
      composite, sampling density, depth convention or remeasurement interval —
      not blank fields, no fields. The CER landing page for the register states
      that project-level sampling plans and measurement reports are not
      published. So for 999 of 999 Australian soil carbon projects, the Phase 5
      audit cannot be attempted from public documents at all.

