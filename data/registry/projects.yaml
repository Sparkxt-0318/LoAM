blocked_or_deferred:
  - target: Verra registry project search and document download (registry.verra.org)
    attempts: 2
    outcome: >-
      Every path tried returns the Angular single-page-application shell rather
      than JSON or a document — /uiapi/resource/resourceSummary/search,
      /uiapi/resource/resource/search, /uiapi/asset/asset/search and
      /app/projectDetail/VCS/<id>. No project document was reached DIRECTLY from
      Verra. The one Verra project in this corpus was reached through a
      validation report mirrored on a third-party site.
    consequence: >-
      Verra project design documents are public in principle and were not
      machine-reachable from this environment. A browser session would very
      likely reach them, which makes this an access wall rather than a
      disclosure gap, and it must NOT be counted as one in the gap analysis.
    next_step: "a human with a browser, or a headless browser, can list VM0042 projects and pull PDDs directly"
  - target: Climate Action Reserve registry pagination beyond the first 50 projects
    attempts: 2
    outcome: "the report paginates by CSRF-bound POST; a page-2 POST returned HTTP 302, and a CSV export returned HTTP 411"
    consequence: >-
      Only the first page of the CAR project report was enumerated, which
      contained one Soil Enrichment project (CAR1513). CAR1459 was reached by
      direct project ID. The count of SEP projects in the Reserve is therefore
      NOT known and no CAR-wide census appears in this file.
    next_step: "drive the report form with a session-carrying client, or ask the Reserve for a project export"
  - target: Gold Standard and Isometric registries
    attempts: 0
    outcome: not attempted this session
    next_step: "both publish project documents; Gold Standard has an SOC framework methodology"
  - target: Verra VM0042 uncertainty rule as written in the methodology
    attempts: 0
    outcome: >-
      NOT verified. The brief describes VM0042 as using '0.43 SE'; the CAR SEP
      rule verified here is z(70%) x half-width of the 95% CI, which is a
      different construct. The VM0042 rule must be read from the methodology
      before either is quoted alongside the other.
    next_step: "read VM0042 v2.1/v2.2 section on uncertainty deduction directly"
