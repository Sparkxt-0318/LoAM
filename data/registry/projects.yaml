# LoAM Phase 5 registry corpus — sampling design parameters of registered
# soil carbon projects.
#
# PURPOSE. Phase 5 asks whether a registered project's sampling design could
# have detected the change it claimed. That question needs design parameters,
# and this file is where they are collected from public registry documents.
#
# DISCIPLINE, mirroring data/variance_components.yaml. Every field carries a
# `status`, a `source` key and a `locator`. Nothing is filled in from memory,
# from a press release, or from what the methodology requires — a methodology
# requirement is what a project OUGHT to do, not what it did.
#
#   status values
#     stated        the document says it, in the words recorded in `note`
#     inferred      derived by us from something the document does say; the
#                   derivation is in `note` and it is ALWAYS marked
#     not_disclosed searched for and NOT found in the public documents held.
#                   The search is recorded so a reader can retrace it.
#     withheld      the public document EXPLICITLY refers to a document that
#                   carries the parameter, and that document is not public.
#                   Stronger than not_disclosed: we know the number exists.
#     not_applicable the parameter has no meaning for this project
#
# `withheld` is the finding-bearing status. It separates "nobody wrote it down"
# from "it is written down and you may not see it".
#
# SCOPE. LoAM is locked to SOC, cropland topsoil, temperate, 1-2 practices.
# Projects outside that are recorded with `in_loam_scope: false` and a reason,
# never deleted — same rule as D-016 for variance-table rows. They still carry
# the gap analysis, which is about disclosure and not about scope.
#
# Access date for every source in this file: 2026-08-12.

schema_version: 1
compiled: 2026-08-12
compiled_by: scripts have not been written for this file; it is hand-curated
note: >-
  FIRST PASS. Seven projects across three registries, selected to span the
  disclosure range rather than to be representative. The corpus is not a
  sample and no rate computed from it generalises. The register-wide counts in
  `registry_coverage` DO generalise, because they are censuses.

