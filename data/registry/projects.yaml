    mdd_assessed:
      value: "not relevant and therefore not further assessed"
      status: stated
      source: agreena_val_v4
      locator: >-
        Data and Parameters Monitored table — the rows MDD, S, n, n-1 and t_x,u
        each carry frequency 'NA' and the VVB assessment 'The parameter is not
        relevant and therefore not further assessed.'
      note: >-
        THE FINDING. VM0042 v2.0's own parameter tables make the calculation
        optional ('Calculation of the number of required samples to detect a
        minimum difference is optional for projects'), and this project took the
