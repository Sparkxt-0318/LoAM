    depth_cm: {value: null, status: withheld, source: agreena_val_v4, locator: "PD Appendix 6, not reproduced; VM0042 requires a minimum of 30 cm but the project's own depth is not in this document"}
    depth_convention:
      value: null
      status: withheld
      source: agreena_val_v4
      locator: "PD Appendix 6, not reproduced"
      note: >-
