# Phase 0 variance-component reference table -- CURATED SOURCE OF TRUTH.
#
# Edit THIS file, never variance_table.csv. Regenerate the CSV with:
#     .venv/bin/python -m loam.build_table
#
# Rules enforced by tests/test_variance_table.py (see src/loam/schema.py):
#   * no row without a citation, a resolvable DOI/URL and an exact locator
#   * no row without a harmonization_note stating the assumption made
#   * mean_dependent rows must record the reference stock they used
#   * unverified rows can never be a baseline
#   * systematic (bias) rows must not carry a harmonised standard deviation
#
# Scope lock: cropland, temperate, 0-30 cm topsoil, cover crops / reduced till.
# Out-of-scope rows are RETAINED as contrast and marked in_scope: false. They
# document what we deliberately did not borrow.

rows:

  # =====================================================================
  # 1. ANALYTICAL / LABORATORY ERROR
  # =====================================================================

  - row_id: VC-ANA-001
    component: analytical
    quantity_definition: >-
      Standard deviation between two technical replicates of the same milled
      soil sample, determined by dry combustion in one laboratory. One field
      location, one date; only the determination is repeated.
    error_kind: random
    quantity: >-
      Analytical error of SOC determination, from the deviation between two
      technical replicates of each milled sample (dry combustion).
    statistic: mae
    value: 1.0
    units: pct
    uncertainty_type: not_reported
    n: 16
    cv_pct: 1.25
    harmonization_method: mae_to_sd_gaussian
    harmonization_note: >-
      Source reports a mean absolute percentage error of about 1%. Converted to
      a standard deviation assuming the replicate deviations are normally
      distributed with zero mean, so SD = MAE * sqrt(pi/2) = MAE * 1.2533,
      giving CV = 1.25%. If the replicate error is heavier-tailed than normal
      this UNDERSTATES the SD. Left in relative units; no absolute SD is given
      because analytical error scales with SOC concentration, not with stock.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: deflates
    bias_direction_reasoning: >-
      Understates on two independent counts. (1) The MAE-to-SD conversion
      assumes normality; replicate errors with heavier tails would give a
      larger SD (D-003). (2) More importantly, the source quantified this from
      two technical replicates of the SAME milled aliquot, which excludes
      subsampling and sample-preparation error entirely. VC-ANA-004 shows
      processing error can dwarf instrument error, so 1% is the narrowest
      possible slice of 'analytical error'.
    land_use: cropland
    management: mixed
    climate: temperate maritime to continental
    koppen: Cfb
    soil_texture: sand to clay loam
    soil_group: Cambisol, Luvisol, Gleysol, Anthrosol, Pelosol, Colluvisol
    country_region: northeast Germany
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    bd_method: core
    support_note: milled aliquots, two technical replicates per sample, default per measurement
    citation: >-
      Poeplau, C., Prietz, R., & Don, A. (2022). Plot-scale variability of
      organic carbon in temperate agricultural soils - Implications for soil
      monitoring. Journal of Plant Nutrition and Soil Science. (Volume and page
      numbers of the version of record are UNCONFIRMED; the copy held locally is
      the accepted manuscript, paginated 1-14. The DOI is authoritative.)
    doi_or_url: https://doi.org/10.1002/jpln.202100393
    locator: "Section 4 (Discussion), sentence beginning 'In accordance with Goidts et al. (2009), we found the analytical error to be a negligible source of uncertainty'"
    access: paywalled
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: baseline
    osse_distribution: normal(0, 0.0125 * soc_concentration)
    notes: >-
      Verified from an open-access copy of the accepted manuscript retrieved via
      the German National Library (d-nb.info/125318657X/34). Publisher version is
      paywalled. This is the smallest of the six components by a wide margin,
      which is itself the finding: lab error is not what limits detectability.

  - row_id: VC-ANA-002
    component: analytical
    quantity_definition: >-
      Dispersion between replicate determinations of the same soil sample by
      elemental analysis in European laboratories. Nothing spatial varies.
    error_kind: random
    quantity: >-
      Analytical error of elemental analysis for SOC content in European
      agricultural soils.
    statistic: cv_pct
    value: 2.5
    units: pct
    value_low: 2.0
    value_high: 3.0
    uncertainty_type: range_across_studies
    cv_pct: 2.5
    harmonization_method: reported_directly
    harmonization_note: >-
      Used as printed, as a relative SD on SOC concentration. NOT converted to an
      absolute stock error: doing so would require a mean stock and would make
      the row mean-dependent for no analytical gain.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: unknown
    bias_direction_reasoning: >-
      No defensible direction. The value was read in a citing source rather
      than the original, and that citing source quotes it inconsistently
      ('2-3%' in one place, '2.5%' in another). Without the original we do not
      know which error terms the figure comprises - instrument only, or
      instrument plus subsampling - and those two readings sit on opposite
      sides of the truth. Resolvable by reading Saby et al.
    land_use: cropland
    management: mixed
    climate: temperate
    koppen: Cfb
    country_region: Europe
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    support_note: plots of 1-400 m2
    citation: >-
      Saby, N. P. A., Bellamy, P. H., Morvan, X., Arrouays, D., Jones, R. J. A.,
      Verheijen, F. G. A., Kibblewhite, M. G., Verdoodt, A., Uveges, J. B.,
      Freudenschuss, A., & Simota, C. (2008). Will European soil monitoring
      networks be able to detect changes in topsoil organic carbon content?
      Global Change Biology, 14(10), 2432-2442.
    doi_or_url: https://doi.org/10.1111/j.1365-2486.2008.01658.x
    locator: "cited in Poeplau et al. (2022), Section 1 and Section 4"
    access: paywalled
    verification: verified_secondary
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: sensitivity_high
    osse_distribution: normal(0, 0.025 * soc_concentration)
    notes: >-
      NUMBER READ IN A CITING SOURCE, NOT THE ORIGINAL. Poeplau et al. (2022)
      quote it twice with slightly different framing ('2-3%' in one place, '2.5%'
      in another). Needs the Saby et al. PDF before promotion to baseline.

  - row_id: VC-ANA-003
    component: analytical
    quantity_definition: >-
      Systematic offset between determinations of the same sample air-dried at
      40 C and oven-dried at 105 C - a difference between sample preparation
      treatments applied to one soil, not between field positions.
    error_kind: systematic
    quantity: >-
      Underestimation of SOC concentration when samples are air-dried rather
      than oven-dried at 105 C, caused by residual moisture diluting carbon.
    statistic: bias_pct
    value: 5.0
    units: pct
    uncertainty_type: not_reported
    harmonization_method: reported_directly
    harmonization_note: >-
      Directional bias, recorded as printed. Deliberately carries NO harmonised
      SD: a bias must never be summed into a variance budget (rule R9). In the
      OSSE this belongs as a multiplicative offset on the measurement operator,
      applied only when the protocol specifies air-drying.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: unknown
    bias_direction_reasoning: >-
      No defensible direction for our scope. The 5% air-drying offset was
      measured over 0-20 cm on a population pooling cropland with pasture,
      rangeland and prairie; we need 0-30 cm cropland. Residual-moisture bias
      depends on texture and clay content, which differ across that pooled
      population in ways the source does not resolve, so the transfer error
      cannot be signed either way.
    land_use: multiple
    management: mixed
    climate: temperate continental
    country_region: central United States
    depth_top_cm: 0
    depth_bottom_cm: 20
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    support_note: 12 agricultural sites; cropland, pasture, rangeland, tallgrass prairie
    citation: >-
      Even, R. J., Machmuller, M. B., Lavallee, J. M., Zelikova, T. J., &
      Cotrufo, M. F. (2025). Large errors in soil carbon measurements attributed
      to inconsistent sample processing. SOIL, 11, 17-34.
    doi_or_url: https://doi.org/10.5194/soil-11-17-2025
    locator: "Results, sample-drying comparison (air-dried vs 105 C)"
    access: open_access
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: false
    use_as: sensitivity_high
    osse_distribution: multiplicative_offset(-0.05)
    notes: >-
      in_scope false on two counts: the depth interval is 0-20 cm, not 0-30 cm,
      and the population pools cropland with pasture, rangeland and prairie. The
      0-20 cm depth was inferred from the sampling description and should be
      confirmed against the methods section before this row is relied on.

  - row_id: VC-ANA-004
    component: analytical
    quantity_definition: >-
      Standard deviation between replicate determinations of the same
      high-rock-content soil after mechanical grinding rather than hand
      processing - a difference between grinding treatments applied to one
      soil.
    error_kind: random
    quantity: >-
      Between-replicate SD of SOC stock introduced by mechanical grinding of a
      high-rock-content soil, relative to gentler processing.
    statistic: sd
    value: 15.0
    units: Mg_C_ha
    uncertainty_type: not_reported
    sd_mg_c_ha: 15.0
    cv_pct: 53.8
    harmonization_method: absolute_to_pct_via_stock
    harmonization_note: >-
      SD used as printed. CV computed as 15.0 / 27.9 = 53.8% using the mean SOC
      stock of 27.9 Mg C/ha that the source reports FOR THE SAME SOIL, so the
      reference stock is internal to the source rather than assumed by us. This
      is still flagged mean_dependent because the relative figure would move if
      that mean were revised.
    reference_stock_mg_c_ha: 27.9
    mean_dependent: true
    bias_direction: inflates
    bias_direction_reasoning: >-
      Explicitly a worst case, not a typical value: a high-rock-content soil
      combined with an aggressive mechanical grinder. Both factors
      independently raise the between-replicate SD, and neither is
      representative of a well-run protocol on temperate cropland topsoil.
      Retained to bound the component, and it will overstate analytical
      variance wherever processing is held constant.
    land_use: multiple
    management: mixed
    climate: temperate continental
    country_region: central United States
    depth_top_cm: 0
    depth_bottom_cm: 20
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    support_note: soil 'H', high rock content; mechanical grinder vs hand processing
    citation: >-
      Even, R. J., Machmuller, M. B., Lavallee, J. M., Zelikova, T. J., &
      Cotrufo, M. F. (2025). Large errors in soil carbon measurements attributed
      to inconsistent sample processing. SOIL, 11, 17-34.
    doi_or_url: https://doi.org/10.5194/soil-11-17-2025
    locator: "Results, grinding-method comparison for soil H"
    access: open_access
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: false
    use_as: sensitivity_high
    osse_distribution: normal(0, 15.0)
    notes: >-
      Worst-case anchor, not a typical value. High rock content and an aggressive
      grinder. Retained because it shows that 'analytical error' is small ONLY
      when sample processing is held constant - the protocol, not the instrument,
      is the risk. Directly contradicts treating component 1 as negligible.

  # =====================================================================
  # 2. WITHIN-PLOT SPATIAL VARIANCE
  # =====================================================================

  - row_id: VC-WPS-001
    component: within_plot_spatial
    quantity_definition: >-
      Relative dispersion of SOC stock between 16 cores within one 20 x 20 m
      cropland plot at 0-10 cm, all taken on one date and analysed by one
      laboratory.
    error_kind: random
    quantity: >-
      Coefficient of variation of SOC stock among 16 soil cores within a
      20 x 20 m cropland plot, 0-10 cm.
    statistic: cv_pct
    value: 9.3
    units: pct
    value_low: 5.8
    value_high: 12.8
    uncertainty_type: sd_of_estimate
    n: 8
    cv_pct: 9.3
    harmonization_method: reported_directly
    harmonization_note: >-
      Used as printed. The reported +/- 3.5 is the SD of the site-level CV across
      the 8 cropland sites, NOT a confidence interval on the mean CV; value_low
      and value_high are value -/+ that SD and must not be read as a 95% CI.
      No absolute SD is given here because that conversion needs a mean stock
      and would make the row mean-dependent.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: inflates
    bias_direction_reasoning: >-
      Each of the 16 cores is a single measurement carrying its own analytical
      and subsampling error, so the among-core CV is spatial variance PLUS
      analytical variance, not pure spatial variance. It is therefore an upper
      bound on the within-plot spatial term. The inflation is small here - VC-
      ANA-001 puts analytical CV near 1.25% against a 9.3% total - but it is
      one-directional.
    land_use: cropland
    management: mixed
    climate: temperate maritime to continental
    koppen: Cfb
    soil_texture: sand to clay loam
    soil_group: Cambisol, Luvisol, Gleysol, Anthrosol
    country_region: northeast Germany
    depth_top_cm: 0
    depth_bottom_cm: 10
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    bd_method: core
    support_note: 16 cores per site, 6.7 cm diameter corer, 20 x 20 m plot, max pair distance 28.28 m
    spatial_extent_m: 20.0
    citation: >-
      Poeplau, C., Prietz, R., & Don, A. (2022). Plot-scale variability of
      organic carbon in temperate agricultural soils - Implications for soil
      monitoring. Journal of Plant Nutrition and Soil Science. (Volume and page
      numbers of the version of record are UNCONFIRMED; the copy held locally is
      the accepted manuscript, paginated 1-14. The DOI is authoritative.)
    doi_or_url: https://doi.org/10.1002/jpln.202100393
    locator: "Table 4, SOC stock column, cropland, 0-10 cm depth row"
    access: paywalled
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: baseline
    osse_distribution: normal(0, 0.093 * plot_mean_stock)
    notes: >-
      This is the cleanest in-scope within-plot anchor in the table: temperate
      cropland, fixed depth, explicit support, explicit plot size.

  - row_id: VC-WPS-002
    component: within_plot_spatial
    quantity_definition: >-
      Relative dispersion of SOC stock between 16 cores within one 20 x 20 m
      cropland plot at 10-30 cm, all taken on one date and analysed by one
      laboratory.
    error_kind: random
    quantity: >-
      Coefficient of variation of SOC stock among 16 soil cores within a
      20 x 20 m cropland plot, 10-30 cm.
    statistic: cv_pct
    value: 10.2
    units: pct
    value_low: 5.9
    value_high: 14.5
    uncertainty_type: sd_of_estimate
    n: 8
    cv_pct: 10.2
    harmonization_method: reported_directly
    harmonization_note: >-
      As VC-WPS-001. The +/- 4.3 is the across-site SD of the CV, not a CI.
      Note this layer is 20 cm thick while VC-WPS-001 is 10 cm thick; the two
      CVs cannot be averaged to obtain a 0-30 cm CV without the covariance
      between layers, which the source does not report. See gap G2.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: inflates
    bias_direction_reasoning: >-
      Same mechanism as VC-WPS-001: among-core variance confounds spatial with
      analytical error and so bounds the spatial term from above rather than
      estimating it. Same small magnitude of inflation.
    land_use: cropland
    management: mixed
    climate: temperate maritime to continental
    koppen: Cfb
    soil_texture: sand to clay loam
    soil_group: Cambisol, Luvisol, Gleysol, Anthrosol
    country_region: northeast Germany
    depth_top_cm: 10
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    bd_method: core
    support_note: 16 cores per site, 6.7 cm diameter corer, 20 x 20 m plot
    spatial_extent_m: 20.0
    citation: >-
      Poeplau, C., Prietz, R., & Don, A. (2022). Plot-scale variability of
      organic carbon in temperate agricultural soils - Implications for soil
      monitoring. Journal of Plant Nutrition and Soil Science. (Volume and page
      numbers of the version of record are UNCONFIRMED; the copy held locally is
      the accepted manuscript, paginated 1-14. The DOI is authoritative.)
    doi_or_url: https://doi.org/10.1002/jpln.202100393
    locator: "Table 4, SOC stock column, cropland, 10-30 cm depth row"
    access: paywalled
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: baseline
    osse_distribution: normal(0, 0.102 * plot_mean_stock)
    notes: >-
      Within-plot CV is essentially flat with depth over 0-30 cm (9.3 -> 10.2),
      then jumps to 25.8% at 30-50 cm. Useful: the topsoil scope avoids the
      depth interval where within-plot variance explodes.

  - row_id: VC-WPS-003
    component: within_plot_spatial
    quantity_definition: >-
      Relative dispersion of SOC stock between 16 cores within one 20 x 20 m
      GRASSLAND plot, all taken on one date and analysed by one laboratory.
    error_kind: random
    quantity: >-
      Coefficient of variation of SOC stock among 16 cores within a 20 x 20 m
      GRASSLAND plot, 0-10 and 10-30 cm, retained for contrast with cropland.
    statistic: cv_pct
    value: 10.1
    units: pct
    value_low: 10.1
    value_high: 14.5
    uncertainty_type: range_across_sites
    n: 8
    cv_pct: 10.1
    harmonization_method: reported_directly
    harmonization_note: >-
      value is the 0-10 cm grassland CV; value_high is the 10-30 cm grassland CV
      (14.5%). Recorded as a single contrast row rather than two, because it is
      never used for parameterisation - only to show how much land use moves the
      within-plot term.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: inflates
    bias_direction_reasoning: >-
      Grassland within-plot CV exceeds cropland at every depth in the same
      study (10.1 vs 9.3 at 0-10 cm; 14.5 vs 10.2 at 10-30 cm), because
      tillage homogenises cropland topsoil and permanent swards do not.
      Borrowing this for cropland would overstate the within-plot term.
      Retained only as contrast.
    land_use: grassland
    management: pasture, meadow, green fallow
    climate: temperate maritime to continental
    koppen: Cfb
    country_region: northeast Germany
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    bd_method: core
    support_note: 16 cores per site, 20 x 20 m plot
    spatial_extent_m: 20.0
    citation: >-
      Poeplau, C., Prietz, R., & Don, A. (2022). Plot-scale variability of
      organic carbon in temperate agricultural soils - Implications for soil
      monitoring. Journal of Plant Nutrition and Soil Science. (Volume and page
      numbers of the version of record are UNCONFIRMED; the copy held locally is
      the accepted manuscript, paginated 1-14. The DOI is authoritative.)
    doi_or_url: https://doi.org/10.1002/jpln.202100393
    locator: "Table 4, SOC stock column, grassland rows"
    access: paywalled
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: false
    use_as: out_of_scope_reference
    notes: >-
      Grassland within-plot variance runs about 10-40% higher than cropland at
      the same depth. Quantifies the penalty for borrowing across land use.

  - row_id: VC-WPS-004
    component: within_plot_spatial
    quantity_definition: >-
      Median relative dispersion of SOC concentration between sampling points
      within one plot, for plots of 1-400 m2 in European agricultural
      topsoils.
    error_kind: random
    quantity: >-
      Median plot-scale CV of SOC CONTENT for plots of 1-400 m2 in European
      agricultural topsoils.
    statistic: cv_pct
    value: 3.4
    units: pct
    value_low: 3.0
    value_high: 4.0
    uncertainty_type: range_across_studies
    cv_pct: 3.4
    harmonization_method: reported_directly
    harmonization_note: >-
      CRITICAL CAVEAT: this is the CV of SOC CONCENTRATION, not of SOC STOCK.
      Stock CV is larger because it compounds concentration variance with bulk
      density variance. It is therefore NOT directly comparable to VC-WPS-001/002,
      which are stock CVs. Recorded unconverted; converting would require the
      concentration-density covariance, which is not reported.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: deflates
    bias_direction_reasoning: >-
      Understates on two counts. (1) It is a CV of SOC CONCENTRATION; stock CV
      compounds concentration variance with bulk-density variance and is
      larger (D-020 puts the gap near threefold against Poeplau's directly
      measured stock CV). (2) The plots span 1-400 m2, many far smaller than
      the 400 m2 plots of VC-WPS-001/002, and spatial variance grows with
      support area.
    land_use: cropland
    management: mixed
    climate: temperate
    koppen: Cfb
    country_region: Europe
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    support_note: plots of 1-400 m2, various land uses
    spatial_extent_m: 20.0
    citation: >-
      Saby, N. P. A., Bellamy, P. H., Morvan, X., Arrouays, D., Jones, R. J. A.,
      Verheijen, F. G. A., Kibblewhite, M. G., Verdoodt, A., Uveges, J. B.,
      Freudenschuss, A., & Simota, C. (2008). Will European soil monitoring
      networks be able to detect changes in topsoil organic carbon content?
      Global Change Biology, 14(10), 2432-2442.
    doi_or_url: https://doi.org/10.1111/j.1365-2486.2008.01658.x
    locator: "cited in Poeplau et al. (2022), Section 4 (Discussion)"
    access: paywalled
    verification: verified_secondary
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: sensitivity_low
    notes: >-
      NUMBER READ IN A CITING SOURCE, NOT THE ORIGINAL. Poeplau et al. explicitly
      flag that their own cropland figure (about 8% for SOC content) is more than
      double this. That factor-of-two disagreement between two European cropland
      studies is the honest width of the within-plot term and should be carried
      into Phase 1 as a range, not resolved by picking a favourite.

  # =====================================================================
  # 3. BETWEEN-PLOT SPATIAL VARIANCE
  # =====================================================================

  - row_id: VC-BPS-001
    component: between_plot_spatial
    quantity_definition: >-
      Relative dispersion of SOC stock across a national forest inventory
      network, pooling variation between whole plots with variation between
      microplots within each plot. The source treats the two as comparable and
      does not separate them, so this figure spans two components rather than
      measuring one.
    error_kind: random
    quantity: >-
      Coefficient of variation of soil carbon stock in mineral horizons across
      the Canadian National Forest Inventory plot network.
    statistic: cv_pct
    value: 40.0
    units: pct
    uncertainty_type: not_reported
    n: 532
    cv_pct: 40.0
    harmonization_method: reported_directly
    harmonization_note: >-
      Reported as an approximate value ('~40%') with no dispersion, so
      uncertainty_type is not_reported and must stay that way. Pools within- and
      between-plot spatial variation; the source states the two are comparable
      (see VC-BPS-003), so this figure is NOT a pure between-plot term.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: inflates
    bias_direction_reasoning: >-
      Severely overstates for cropland. Forest soils are unploughed and retain
      fine-scale heterogeneity that annual tillage destroys; this is why the
      verified in-scope cropland CVs in this table are 9-10% against this
      row's 40%. Also pools within- and between-plot variation rather than
      isolating between-plot. Direction is certain even though magnitude is
      not transferable at all.
    land_use: forest
    management: unmanaged and managed forest
    climate: boreal to temperate
    country_region: Canada
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: genetic_horizon
    support_note: 532 plots with repeated measurements, multiple microplots per main plot
    citation: >-
      Buchkowski, R. W., Polussa, A., & Bradford, M. A. (2026). Designing
      national forest inventories for accurate estimation of soil carbon change.
      Global Change Biology, 32(4), e70868.
    doi_or_url: https://doi.org/10.1111/gcb.70868
    locator: "Abstract, sentence beginning 'Spatial variation in soil carbon stocks was substantial'"
    access: paywalled
    verification: verified_abstract
    extracted_on: "2026-08-07"
    in_scope: false
    use_as: out_of_scope_reference
    notes: >-
      OUT OF SCOPE ON THREE COUNTS, and the mismatch is severe enough that this
      number must not be transferred to cropland: (1) forest, not cropland;
      (2) horizon-based sampling, not fixed depth - depth_bottom_cm 30 is a
      placeholder for a genetic horizon, not a measured interval; (3) an
      unmanaged, unploughed, spatially heterogeneous population. Tillage
