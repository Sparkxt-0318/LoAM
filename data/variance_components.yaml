    mean_dependent: false
    bias_direction: deflates
    bias_direction_reasoning: >-
      Understates realistic resampling error. The reported offset is only
      about 40 cm - the smallest displacement physically possible when
      reopening a pit - whereas operational revisits incur far larger offsets
      (VC-REL-005/006 put most LUCAS revisits under 10 m but permit up to 100
      m, and VC-REL-004 demonstrates flatness only out to ~7 m). The MAE-to-SD
      normality assumption of D-003 pushes the same way. Partially offset by
      the inclusion of analytical error, which inflates, but that term is far
      smaller.
