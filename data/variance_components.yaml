      A 100 m offset crosses into between-plot spatial variance territory. At
      that distance the relocation term and the between-plot term are the same
      physical quantity, and the six-component decomposition stops being
      orthogonal. Phase 1 must not add both at large offsets. See gap G5.

  # =====================================================================
  # 6. BULK DENSITY / DEPTH-CONVENTION ERROR
  # =====================================================================

  - row_id: VC-BDC-001
    component: depth_bd_convention
    quantity_definition: >-
      Systematic difference between two accounting conventions applied to the
      same soil - successive fixed-depth sampling to 30 cm versus equivalent
      soil mass - in the estimated CHANGE in SOC stock.
    error_kind: systematic
    quantity: >-
      Underestimation of SOC stock CHANGE by successive fixed-depth sampling to
      30 cm, relative to an equivalent-soil-mass basis, for a bulk density change
      from 1.5 to 1.1 g/cm3.
    statistic: bias_pct
    value: 17.0
    units: pct
    uncertainty_type: not_reported
    harmonization_method: reported_directly
    harmonization_note: >-
      Recorded as a signed systematic bias and deliberately given NO harmonised
      SD (rule R9). The bias is CONDITIONAL on the bulk density trajectory: it is
      a function of the 1.5 -> 1.1 g/cm3 change, not a property of the sampling
      method alone. In the OSSE the bulk density change must therefore be swept
      as an EXOGENOUS scenario parameter, never taken from the carbon model's
      own output - see DECISIONS.md D-007.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: inflates
    bias_direction_reasoning: >-
      The prescribed bulk-density change of 1.5 to 1.1 g/cm3 is a 27%
      decrease, which sits at or just above the top of the 20-25% range of
      observed decreases the authors themselves cite as evidence of realism.
      Bias from the fixed-depth convention grows with the magnitude of the
      density change, so a scenario at the top of the observed range yields a
      bias at the top of the plausible range.
    land_use: cropland
    management: reduced_till / disturbance gradient
    climate: temperate
    country_region: United States (illustrative calculation)
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    bd_method: core
    support_note: prescribed bulk density and SOC changes in a worked scenario
    citation: >-
      Fowler, A. F., Basso, B., Millar, N., & Brinton, W. F. (2023). A simple
      soil mass correction for a more accurate determination of soil carbon stock
      changes. Scientific Reports, 13, 2242.
    doi_or_url: https://doi.org/10.1038/s41598-023-29289-2
    locator: "Abstract, second paragraph; underlying scenario in Table 1"
    access: open_access
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: baseline
    osse_distribution: deterministic_bias(-0.17)
    notes: >-
      IMPORTANT QUALIFICATION THE BRIEF DID NOT CARRY. The authors describe this
      as 'a hypothetical but realistic change' - it is an ILLUSTRATIVE
      CALCULATION from a prescribed scenario, not an empirical measurement. They
      support its realism by citing observed bulk density decreases of 20-25%
      under management change. Usable as a mechanism with a known functional
      form; not usable as an observed effect size.

  - row_id: VC-BDC-002
    component: depth_bd_convention
    quantity_definition: >-
      Difference between accounting conventions applied to the same soil,
      large enough to reverse the sign of the estimated SOC stock change.
    error_kind: systematic
    quantity: >-
      Sign reversal between conventions: the same scenario appears as a 16.2%
      SOC stock LOSS on a fixed-depth basis and a 14.8% GAIN after
      equivalent-soil-mass correction.
    statistic: bias_pct
    value: 16.2
    units: pct
    uncertainty_type: not_reported
    harmonization_method: derived_see_note
    harmonization_note: >-
      value is the apparent fixed-depth loss (16.2%); the ESM-corrected result
      for the identical scenario is a 14.8% gain. We record the fixed-depth
      figure as the value and the reversal in this note rather than logging a
      derived 31-point spread, because the two numbers are percentages of
      different denominators and subtracting them would be arithmetically
      unjustified.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: inflates
    bias_direction_reasoning: >-
      Same prescribed scenario as VC-BDC-001, so it inherits the same top-of-
      observed-range bulk-density change and the same upward bias. Note the
      sign reversal it documents does not depend on the magnitude being right
      - only on the convention error exceeding the true change.
    land_use: cropland
    management: reduced_till / disturbance gradient
    climate: temperate
    country_region: United States (illustrative calculation)
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    bd_method: core
    support_note: Scenario 1 of the paper's worked example
    citation: >-
      Fowler, A. F., Basso, B., Millar, N., & Brinton, W. F. (2023). A simple
      soil mass correction for a more accurate determination of soil carbon stock
      changes. Scientific Reports, 13, 2242.
    doi_or_url: https://doi.org/10.1038/s41598-023-29289-2
    locator: "Results, Scenario 1"
    access: open_access
    verification: verified_fulltext
    extracted_on: "2026-08-07"
    in_scope: true
    use_as: baseline
    osse_distribution: deterministic_bias(scenario_dependent)
    notes: >-
      THE MOST CONSEQUENTIAL ROW IN THE TABLE FOR THE TESTBED'S CLAIM. The depth
      convention can flip the SIGN of a detected change, which means a design can
      be perfectly powered and still report the wrong direction. Detectability is
      therefore NOT sufficient for correctness, and Phase 1 should report
      sign-error rate alongside MDC.

