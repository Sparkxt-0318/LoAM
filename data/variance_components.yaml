    harmonization_method: derived_see_note
    harmonization_note: >-
      DERIVED BY US from the monthly series, not read from the paper (D-041).
      Crossed random effects on log SOC stock, plot and sampling occasion, with
      the treatment as a fixed effect so the plot term means "between replicate
      experimental units" and not "between treatments":
      log C ~ treatment + (1|plot) + (1|occasion).
      Occasion is the sampling CAMPAIGN, not the calendar date - four Adams
      campaigns ran across two consecutive days and keying on date would split
      those months into half-occasions and manufacture an occasion effect.
