  # =====================================================================
  # 4. TEMPORAL (MONTH-TO-MONTH) VARIANCE
  # =====================================================================

  - row_id: VC-TMP-001
    component: temporal
    quantity_definition: >-
      Share of total random error attributable to variation between sampling
      occasions at a fixed set of positions, with management and laboratory
      held constant.
    error_kind: random
    quantity: >-
      Month-to-month variance in measured soil carbon, as a share of total
      random error.
    statistic: variance_share_pct
    value: 20.0
    units: pct
    value_low: 15.0
    value_high: 32.0
    uncertainty_type: range_across_sites
    n: 5
    harmonization_method: variance_share
    harmonization_note: >-
      Expressed as a SHARE of the total random error, not as an absolute SD,
      because that is how the source reports it. Converting to Mg C/ha requires
      knowing the total random error for OUR design, which is a Phase 1 output,
      not a Phase 0 input. Therefore this row must be applied multiplicatively
      inside the simulator, never added as a standalone variance. Doing the
      latter would double-count.
    reference_stock_mg_c_ha:
    mean_dependent: false
    bias_direction: unknown
    bias_direction_reasoning: >-
      Direction genuinely unsignable, as recorded in D-014. Temporal variance
      in measured SOC is driven by moisture cycling and biological activity.
      Pacific Northwest dryland has larger moisture swings but lower
      biological turnover than humid temperate cropland; those two differences
      push the transfer error in OPPOSITE directions and we have no basis for
      ranking them.
    land_use: cropland
    management: dryland small-grain rotations
    climate: semi-arid to sub-humid dryland
    koppen: Csb/BSk
    country_region: Pacific Northwest, United States
    depth_top_cm: 0
    depth_bottom_cm: 30
    depth_basis: fixed_depth
    analytical_method: dry_combustion
    temporal_extent_months: 36
    support_note: 5 sets of monthly samples, up to 3 years each, 4 locations
    citation: >-
      Wuest, S. B. (2024). Temporal variability is a major source of uncertainty
      in soil carbon measurements. Soil Science Society of America Journal.
      (Volume and page numbers UNCONFIRMED - abstract only, full text paywalled.
      The DOI is authoritative.)
    doi_or_url: https://doi.org/10.1002/saj2.20660
    locator: "Abstract"
    access: paywalled
    verification: verified_abstract
    extracted_on: "2026-08-07"
    in_scope: false
    use_as: sensitivity_high
    osse_distribution: variance_share(0.15, 0.32)
    superseded_by: VC-TMP-003, VC-TMP-005, VC-TMP-007, VC-TMP-009, VC-TMP-011
    notes: >-
      SUPERSEDED 2026-08-10 by our own derivation from this study's primary data
      (D-041). KEPT, NOT DELETED, and deliberately so: this row entered at
      `verified_abstract` carrying a variance SHARE and an ASSUMED depth, and a
      reviewer should be able to see it replaced by `derived_primary_data` from
      the same study and check that the two agree. Deleting the rung we climbed
      from would hide the history that makes the ladder worth trusting (D-049).
      THE TWO DO AGREE, which is the point. Our decomposition puts the
      month-to-month share at 18.3% (range 14.4-28.3) against the 20% (15-32)
      printed here, and the agreement survives every model specification we
      tried - 18.3%, 18.4% and 19.5% under three different fixed-effect choices.
      See D-050 for the full comparison, including the one part that does NOT
      reproduce.
      WAS THE WEAKEST LOAD-BEARING ROW IN THE TABLE, and for two months the only
      temporal anchor we had. in_scope is false because the climate is Pacific Northwest DRYLAND,
      not temperate humid cropland - the scope says temperate. Temporal variance
      is plausibly driven by moisture and biological cycling, both of which
      differ systematically between dryland and humid systems, so the direction
      of the transfer error is unknown. Depth 0-30 cm is ASSUMED, not confirmed:
      the abstract does not state the interval and the full text is paywalled.
      Treat every number in this row as provisional until the PDF is read.

