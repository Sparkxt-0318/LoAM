  - row_id: VC-REL-001
    component: relocation
    quantity_definition: >-
      Mean absolute difference in SOC stock between an original profile
      position and a resample displaced from it by about 40 cm, in cropland.
    error_kind: random
    quantity: >-
      Mean absolute error in SOC stock when one soil profile is resampled by one
      profile shifted by about 40 cm, cropland, 0-30 cm.
    statistic: mae
    value: 5.1
    units: Mg_C_ha
    uncertainty_type: not_reported
    n: 8
    sd_mg_c_ha: 6.39
    cv_pct: 9.4
    harmonization_method: mae_to_sd_gaussian
    harmonization_note: >-
      TWO assumptions, both consequential. (1) NORMALITY: the source reports mean
      absolute error, defined in its Eq. 3 as the mean of |SOC_initial -
      SOC_resampled| across sites. Assuming those paired differences are normal
      with zero mean, SD = MAE * sqrt(pi/2) = 5.1 * 1.2533 = 6.39 Mg C/ha, and
      likewise 7.5% -> 9.4%. (2) DIFFERENCE SCALE: 6.39 is the SD of the
      DIFFERENCE between two locations, not of a single observation. If the two
      locations are treated as independent draws from the same field, the
      per-observation relocation SD is 6.39 / sqrt(2) = 4.52 Mg C/ha. Phase 1
      must state which of the two it is using; conflating them inflates or
      deflates MDC by a factor of sqrt(2). Not marked mean_dependent because the
      source reports both absolute and relative forms directly, so no assumed
      mean stock was needed.
