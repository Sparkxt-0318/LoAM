[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loam"
version = "0.0.1"
description = "LoAM: an OSSE testbed for the detectability of soil organic carbon change"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only needed to re-run the exploratory derivations under scripts/. Deliberately
# NOT in `dev`: CI installs `dev` and runs the tests, and the tests must not
# depend on a heavy scientific stack to validate a curated table.
derive = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.scripts]
loam-build-table = "loam.build_table:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
