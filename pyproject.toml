[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loam"
version = "0.0.1"
description = "LoAM: an OSSE testbed for the detectability of soil organic carbon change"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
loam-build-table = "loam.build_table:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
